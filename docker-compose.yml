version: '3.8'

services:
  # =========================================================================
  # Primary PostgreSQL Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: selfhealing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CloudSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-selfhealing_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudadmin} -d ${POSTGRES_DB:-selfhealing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - selfhealing-network

  # =========================================================================
  # FastAPI Self-Healing Backend & Monitoring Engine
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: selfhealing-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://cloudadmin:CloudSecurePass2026!@postgres:5432/selfhealing_db
      - SECRET_KEY=${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      - AUTO_RECOVERY_GLOBAL_ENABLED=true
      - SIMULATION_MODE_DEFAULT=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - selfhealing-network

  # =========================================================================
  # React + Vite Cloud Operations Frontend Dashboard
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: selfhealing-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - selfhealing-network

  # =========================================================================
  # Prometheus Telemetry Collector
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: selfhealing-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - selfhealing-network

  # =========================================================================
  # Grafana Dashboard Visualizer
  # =========================================================================
  grafana:
    image: grafana/grafana:10.3.3
    container_name: selfhealing-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - selfhealing-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  selfhealing-network:
    driver: bridge
