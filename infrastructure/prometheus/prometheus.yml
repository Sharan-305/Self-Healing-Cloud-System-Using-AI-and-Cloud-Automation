global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "self-healing-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "demo-services"
    static_configs:
      - targets: ["demo-api-gateway:8080", "demo-auth-service:8081", "demo-payment-service:8082"]
